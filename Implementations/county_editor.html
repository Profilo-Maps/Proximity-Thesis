<!-- Serve: cd Implementations && uv run uvicorn editor_server:app --reload --port 8081 -->
<!-- Open:  http://localhost:8081/ -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Proximity Editor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
#map { width: 100%; height: 100vh; }
#status {
  position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
  z-index: 9999; background: white; padding: 5px 14px;
  border: 1px solid #ccc; border-radius: 4px;
  font-family: sans-serif; font-size: 12px; white-space: nowrap;
  pointer-events: none;
}
#error-banner {
  display: none; position: fixed; top: 0; left: 0; right: 0;
  background: #b00; color: white; padding: 10px 16px;
  z-index: 10000; font-family: sans-serif; font-size: 13px; text-align: center;
}
#legend {
  position: fixed; bottom: 30px; left: 30px; z-index: 9999;
  background: white; padding: 10px 14px; border: 2px solid #aaa;
  border-radius: 6px; font-size: 13px; font-family: sans-serif; line-height: 1.9;
}
#px-search {
  position: fixed; top: 70px; right: 10px; z-index: 9999;
  background: white; padding: 10px 14px; border: 2px solid #aaa;
  border-radius: 6px; font-size: 13px; font-family: sans-serif; line-height: 1.6;
}
#px-probe-toggle {
  position: fixed; top: 10px; left: 10px; z-index: 10001;
  padding: 5px 12px; border: 2px solid #aaa; border-radius: 4px; cursor: pointer;
  background: white; color: #333; font: 12px sans-serif;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}
#px-probe {
  position: fixed; top: 42px; left: 10px; z-index: 10002;
  background: white; border: 2px solid #aaa; border-radius: 6px;
  font: 12px/1.5 sans-serif; color: #333; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  max-width: 280px; min-width: 200px; display: none;
}
@keyframes px-pulse {
  0%   { opacity: 0.7; transform: scale(1); }
  50%  { opacity: 1;   transform: scale(1.4); }
  100% { opacity: 0.7; transform: scale(1); }
}
.px-pulse { animation: px-pulse 1.5s ease-in-out infinite; }
</style>
</head>
<body>
<div id="error-banner"></div>
<div id="status">Initializing DuckDB WASM…</div>
<div id="map"></div>

<div id="px-coords" style="
    position:fixed;bottom:30px;right:340px;z-index:9999;
    background:rgba(255,255,255,0.92);padding:6px 12px;border-radius:6px;
    font:12px/1.4 monospace;color:#333;box-shadow:0 1px 4px rgba(0,0,0,0.2);
    pointer-events:none;display:none;">
</div>

<button id="px-probe-toggle">&#128269; Probe</button>

<!-- Editor toolbar -->
<div id="px-toolbar" style="
  position:fixed; top:80px; left:10px; z-index:10001;
  display:flex; flex-direction:column; gap:4px;">
  <button class="px-tool" data-mode="add_node"
    style="padding:5px 10px;border:2px solid #aaa;border-radius:4px;cursor:pointer;
           background:white;color:#333;font:12px sans-serif;
           box-shadow:0 1px 4px rgba(0,0,0,0.15);white-space:nowrap;">
    + Node
  </button>
  <button class="px-tool" data-mode="draw_crosswalk"
    style="padding:5px 10px;border:2px solid #aaa;border-radius:4px;cursor:pointer;
           background:white;color:#333;font:12px sans-serif;
           box-shadow:0 1px 4px rgba(0,0,0,0.15);white-space:nowrap;">
    Crosswalk
  </button>
  <button class="px-tool" data-mode="move_endpoint"
    style="padding:5px 10px;border:2px solid #aaa;border-radius:4px;cursor:pointer;
           background:white;color:#333;font:12px sans-serif;
           box-shadow:0 1px 4px rgba(0,0,0,0.15);white-space:nowrap;">
    Move
  </button>
</div>

<div id="px-probe">
  <div style="background:#1a73e8;color:white;padding:5px 10px;border-radius:4px 4px 0 0;
              display:flex;justify-content:space-between;align-items:center;">
    <b>Probe</b>
    <span id="px-probe-close" style="cursor:pointer;font-size:14px;line-height:1;">&times;</span>
  </div>
  <div style="padding:6px 10px;">
    <label style="font-size:11px;color:#666;">
      Radius:
      <input id="px-probe-radius" type="range" min="5" max="100" value="20"
             style="width:90px;vertical-align:middle;">
      <span id="px-probe-radius-val">20</span> m
    </label>
  </div>
  <div style="padding:0 8px 4px;">
    <b style="font-size:11px;color:#555;">Nearby Segments</b>
    <div id="px-probe-segs" style="max-height:200px;overflow-y:auto;margin-top:2px;"></div>
  </div>
  <hr style="margin:4px 8px;border:none;border-top:1px solid #ddd;">
  <div style="padding:0 8px 8px;">
    <b style="font-size:11px;color:#555;">Nearby Points</b>
    <div id="px-probe-pts" style="max-height:160px;overflow-y:auto;margin-top:2px;"></div>
  </div>
</div>

<div id="legend">
  <b style="font-size:14px">Legend</b><br>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_nodes" checked>
    <span style="color:#8b0000;font-size:18px;line-height:1">&#9679;</span> Intersection Nodes
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_ramps" checked>
    <span style="color:#ff8c00;font-size:18px;line-height:1">&#9679;</span> Curb Ramps
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_calm" checked>
    <span style="color:#6a0dad;font-size:18px;line-height:1">&#9679;</span> Traffic Calming
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_sw_off" checked>
    <span style="color:#add8e6;font-size:18px;line-height:1">&#9644;</span> Sidewalks – offset
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_sw_sep" checked>
    <span style="color:#00008b;font-size:18px;line-height:1">&#9644;</span> Sidewalks – separate
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_bk_off" checked>
    <span style="color:#90ee90;font-size:18px;line-height:1">&#9644;</span> Bikeways – offset
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_bk_sep" checked>
    <span style="color:#006400;font-size:18px;line-height:1">&#9644;</span> Bikeways – separate
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_streets" checked>
    <span style="color:#c0392b;font-size:18px;line-height:1">&#9644;</span> Streets
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_slots" checked>
    <span style="color:#0891b2;font-size:16px;line-height:1">&#9634;</span> Crosswalk Slots
  </label>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="cb_hulls" checked>
    <span style="color:#b45309;font-size:16px;line-height:1">&#9634;</span> Intersection Hulls
  </label>
</div>

<div id="px-search">
  <b style="font-size:14px">Search</b><br>
  <div style="display:flex;gap:4px;margin:6px 0 4px;">
    <button id="px-mode-seg" style="flex:1;padding:3px 8px;border:1px solid #888;border-radius:4px;cursor:pointer;background:#1a73e8;color:white;font-size:12px;">
      Segment ID
    </button>
    <button id="px-mode-node" style="flex:1;padding:3px 8px;border:1px solid #888;border-radius:4px;cursor:pointer;background:white;color:#333;font-size:12px;">
      Node ID
    </button>
  </div>
  <div style="display:flex;gap:4px;">
    <input id="px-search-input" type="text" placeholder="e.g. 12_34_0"
           style="flex:1;padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px;min-width:140px;"
           onkeydown="if(event.key==='Enter')pxSearch()">
    <button onclick="pxSearch()"
            style="padding:4px 10px;border:1px solid #888;border-radius:4px;cursor:pointer;background:#f5f5f5;font-size:12px;">
      Go
    </button>
  </div>
  <div id="px-search-status" style="margin-top:5px;font-size:11px;color:#555;min-height:14px;"></div>
</div>

<!-- Changeset panel -->
<div id="px-changeset" style="
  position:fixed; bottom:30px; right:30px; z-index:9999;
  background:white; border:2px solid #aaa; border-radius:6px;
  font:12px/1.5 sans-serif; color:#333; box-shadow:0 2px 6px rgba(0,0,0,0.2);
  min-width:220px; max-width:300px;">
  <div style="background:#1a73e8;color:white;padding:5px 10px;border-radius:4px 4px 0 0;
              display:flex;justify-content:space-between;align-items:center;cursor:pointer;"
       onclick="document.getElementById('px-cs-body').style.display=
                document.getElementById('px-cs-body').style.display==='none'?'block':'none'">
    <b>Changeset</b>
    <span style="font-size:10px;">&#9660;</span>
  </div>
  <div id="px-cs-body" style="padding:8px 10px;">
    <div id="px-cs-counts" style="margin-bottom:6px;font-size:11px;color:#555;">No edits</div>
    <div id="px-cs-stage" style="margin-bottom:8px;font-size:11px;color:#888;"></div>
    <div style="display:flex;gap:6px;">
      <button id="px-cs-save" onclick="doSave()"
              style="flex:1;padding:4px 8px;background:#16a34a;color:white;border:none;
                     border-radius:4px;cursor:pointer;font-size:12px;">
        Save
      </button>
      <button id="px-cs-discard" onclick="discardChangeset()"
              style="flex:1;padding:4px 8px;background:#dc2626;color:white;border:none;
                     border-radius:4px;cursor:pointer;font-size:12px;">
        Discard
      </button>
    </div>
    <div id="px-cs-spinner" style="display:none;text-align:center;margin-top:6px;font-size:11px;color:#1a73e8;">
      Saving&hellip;
    </div>
  </div>
</div>

<!-- Context menu -->
<div id="px-ctx-menu" style="
  display:none; position:fixed; z-index:10003;
  background:white; border:1px solid #ccc; border-radius:4px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2); font:12px sans-serif;
  min-width:160px; overflow:hidden;">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.min.js"></script>
<script type="module">
import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm';

// ── Config from query params ────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const PARQUET_FILE = params.get('parquet') || 'San_Francisco_County_California_USA_network.parquet';
const PARQUET_URL = `${window.location.origin}/parquet/${PARQUET_FILE}`;
const HULL_FC = { type: 'FeatureCollection', features: [] };
const SLOT_FC = { type: 'FeatureCollection', features: [] };

// ── Changeset state ─────────────────────────────────────────────────────────
// TODO: Implement undo/redo with a linear undo stack (ctrl+z / ctrl+y)
const STAGE_NAMES = ['SNAP_ENDPOINTS', 'BUILD_HULLS', 'ASSIGN_CURB_RAMPS', 'CREATE_CROSSWALKS'];
const EDIT_STAGE_MAP = {
  move_endpoint: 0, add_node: 1, consolidate_hulls: 1,
  toggle_curb_ramp: 2, draw_crosswalk: 3,
};

const _LS_KEY = 'px_editor_changeset';

function emptyChangeset() {
  return {
    parquet: PARQUET_FILE,
    dirty_from_stage: null,
    edits: {
      added_nodes: [],
      consolidated_hulls: [],
      moved_endpoints: [],
      toggled_curb_ramps: [],
      drawn_crosswalks: [],
    },
  };
}

function loadChangeset() {
  try {
    const raw = localStorage.getItem(_LS_KEY);
    if (!raw) return emptyChangeset();
    const cs = JSON.parse(raw);
    if (cs.parquet !== PARQUET_FILE) return emptyChangeset();
    return cs;
  } catch (_) { return emptyChangeset(); }
}

function saveChangeset(cs) {
  localStorage.setItem(_LS_KEY, JSON.stringify(cs));
  renderChangesetPanel(cs);
}

let changeset = loadChangeset();

function recordEdit(editType, editData) {
  const stage = EDIT_STAGE_MAP[editType];
  if (changeset.dirty_from_stage === null || stage < changeset.dirty_from_stage) {
    changeset.dirty_from_stage = stage;
  }
  const key = {
    move_endpoint: 'moved_endpoints',
    add_node: 'added_nodes',
    consolidate_hulls: 'consolidated_hulls',
    toggle_curb_ramp: 'toggled_curb_ramps',
    draw_crosswalk: 'drawn_crosswalks',
  }[editType];
  changeset.edits[key].push(editData);
  saveChangeset(changeset);
}

function discardChangeset() {
  changeset = emptyChangeset();
  localStorage.removeItem(_LS_KEY);
  renderChangesetPanel(changeset);
  lg.editor.clearLayers();
  _consolidationSelected.clear();
  setStatus('Changeset discarded');
}

// ── Coordinate helpers ────────────────────────────────────────────────────────
// Parquet geometries are stored in EPSG:4326 (WGS84). proj4 is still used for
// converting click/drag coordinates when sending edits to the server.
proj4.defs('EPSG:32610', '+proj=utm +zone=10 +datum=WGS84 +units=m +no_defs');

function viewportToBBox(bounds) {
  return { minX: bounds.getWest(), minY: bounds.getSouth(), maxX: bounds.getEast(), maxY: bounds.getNorth() };
}

// Geometries from DuckDB are already WGS84 [lon, lat] — no reprojection needed.
function xfGeom(g) { return g; }

// ── Incline-based colour darkening (mirrors _blend_with_black in Python) ─────
function blendBlack(hex, opacity) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  const f = 1 - Math.max(0, Math.min(1, opacity));
  return '#' + [r,g,b].map(v => Math.round(v*f).toString(16).padStart(2,'0')).join('');
}
function inclineColor(base, raw) {
  const v = Math.abs(parseFloat(raw));
  if (isNaN(v)) return base;
  return blendBlack(base, Math.min(v / 30, 1) * 0.5);
}

// ── Colours (matching generate_map) ──────────────────────────────────────────
const C = {
  street:  '#c0392b',
  bk_sep:  '#006400', bk_off: '#90ee90',
  sw_sep:  '#00008b', sw_off: '#add8e6',
  node:    '#8b0000',
  ramp:    '#ff8c00',
  calm:    '#6a0dad',
  cross:   '#ff00ff',
  cret:    '#008080',
};

// ── Zoom tier thresholds ──────────────────────────────────────────────────────
function getTier(zoom) {
  if (zoom >= 18) return 5;
  if (zoom >= 17) return 4;
  if (zoom >= 15) return 3;
  if (zoom >= 13) return 2;
  return 1;
}

const HW_RE = {
  1: "(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link)",
  2: "(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|busway|cycleway)",
};

// ── Leaflet map ───────────────────────────────────────────────────────────────
const map = L.map('map', { maxZoom: 23 }).setView([37.7749, -122.4194], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxNativeZoom: 20, maxZoom: 23,
}).addTo(map);

const lg = {
  streets: L.layerGroup().addTo(map),
  bk_sep:  L.layerGroup().addTo(map),
  bk_off:  L.layerGroup().addTo(map),
  sw_sep:  L.layerGroup().addTo(map),
  sw_off:  L.layerGroup().addTo(map),
  nodes:   L.layerGroup().addTo(map),
  ramps:   L.layerGroup().addTo(map),
  calm:    L.layerGroup().addTo(map),
  hulls:   L.layerGroup().addTo(map),
  slots:   L.layerGroup().addTo(map),
  editor:  L.layerGroup().addTo(map),
};

// ── Search index ─────────────────────────────────────────────────────────────
const segIndex   = new Map();   // street_grid_id / sidewalk_*_ID / bk_* → { layer, mid, baseColor, baseWeight, label }
const nodeIndex  = new Map();   // node_id (string) → { mid }
const pointIndex = new Map();   // node_* / ramp_* → { layer, lat, lon, label, baseColor, baseRadius }
let   _pxMode    = 'seg';

// ── Editor modes ──────────────────────────────────────────────────────────────
let _editorMode = null;  // null | 'add_node' | 'draw_crosswalk' | 'move_endpoint'

function setEditorMode(mode) {
  if (_editorMode === mode) mode = null;  // toggle off
  _editorMode = mode;
  document.querySelectorAll('.px-tool').forEach(btn => {
    const m = btn.dataset.mode;
    btn.style.background  = m === mode ? '#1a73e8' : 'white';
    btn.style.color       = m === mode ? 'white'   : '#333';
    btn.style.borderColor = m === mode ? '#1a73e8' : '#aaa';
  });
  map.getContainer().style.cursor = mode === 'add_node' ? 'crosshair'
    : mode === 'draw_crosswalk' ? 'pointer'
    : mode === 'move_endpoint'  ? 'grab'
    : '';
  // Clear in-progress state when switching modes
  if (mode !== 'draw_crosswalk') {
    _xwFirstRamp = null;
    if (_xwPreviewLine) { map.removeLayer(_xwPreviewLine); _xwPreviewLine = null; }
  }
  if (mode !== 'move_endpoint') {
    _dragNode = null;
  }
  setStatus(mode ? `Mode: ${mode.replace(/_/g, ' ')}` : 'Ready');
}

document.querySelectorAll('.px-tool').forEach(btn => {
  btn.addEventListener('click', () => setEditorMode(btn.dataset.mode));
});

// ── Context menu ──────────────────────────────────────────────────────────────
const _ctxMenu = document.getElementById('px-ctx-menu');
let _ctxTarget = null;

function showContextMenu(x, y, items) {
  _ctxMenu.innerHTML = items.map((item, idx) =>
    `<div class="px-ctx-item" data-idx="${idx}" style="padding:6px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;"
          onmouseover="this.style.background='#e8f0fe'"
          onmouseout="this.style.background='white'">
      ${item.label}
    </div>`
  ).join('');
  // Bind click handlers
  _ctxMenu.querySelectorAll('.px-ctx-item').forEach((el, idx) => {
    el.addEventListener('click', () => { items[idx].action(); hideContextMenu(); });
  });
  _ctxMenu.style.left = x + 'px';
  _ctxMenu.style.top  = y + 'px';
  _ctxMenu.style.display = 'block';
}

function hideContextMenu() { _ctxMenu.style.display = 'none'; }

document.addEventListener('click', e => {
  if (!_ctxMenu.contains(e.target)) hideContextMenu();
});

map.getContainer().addEventListener('contextmenu', e => e.preventDefault());

// ── Hull consolidation selection ──────────────────────────────────────────────
const _consolidationSelected = new Map();  // node_id → { ring, latlng, utmX, utmY }

function toggleConsolidationSelect(nodeId, marker, latlng) {
  if (_consolidationSelected.has(nodeId)) {
    const entry = _consolidationSelected.get(nodeId);
    if (entry.ring) lg.editor.removeLayer(entry.ring);
    _consolidationSelected.delete(nodeId);
  } else {
    const ring = L.circleMarker(latlng, {
      radius: 10, color: '#f97316', fillColor: 'transparent',
      weight: 3, opacity: 0.9,
    }).bindTooltip('Selected for consolidation').addTo(lg.editor);
    const utm = proj4('EPSG:4326', 'EPSG:32610', [latlng.lng, latlng.lat]);
    _consolidationSelected.set(nodeId, { ring, latlng, utmX: utm[0], utmY: utm[1] });
  }
  setStatus(`${_consolidationSelected.size} node(s) selected for consolidation`);
}

function doConsolidate() {
  if (_consolidationSelected.size < 2) {
    setStatus('Select 2+ nodes to consolidate'); return;
  }
  const nodeKeys = [];
  _consolidationSelected.forEach(v => nodeKeys.push([v.utmX, v.utmY]));
  recordEdit('consolidate_hulls', { node_keys: nodeKeys, buffer_m: null });
  _consolidationSelected.forEach(v => { if (v.ring) lg.editor.removeLayer(v.ring); });
  _consolidationSelected.clear();
  setStatus('Hull consolidation recorded');
}

// ── Crosswalk drawing ─────────────────────────────────────────────────────────
let _xwFirstRamp = null;
let _xwPreviewLine = null;

function handleRampClickForCrosswalk(rampData, latlng) {
  if (_editorMode !== 'draw_crosswalk') return;

  if (!_xwFirstRamp) {
    _xwFirstRamp = { ...rampData, latlng };
    setStatus('Click second curb ramp to complete crosswalk');
    map.on('mousemove', _xwMouseMove);
    return;
  }

  map.off('mousemove', _xwMouseMove);
  if (_xwPreviewLine) { map.removeLayer(_xwPreviewLine); _xwPreviewLine = null; }

  L.polyline([_xwFirstRamp.latlng, latlng], {
    color: '#ff00ff', weight: 3, opacity: 0.8, dashArray: '8 4',
  }).bindTooltip('Crosswalk (unsaved)').addTo(lg.editor);

  recordEdit('draw_crosswalk', {
    ramp_a: {
      segment_id: _xwFirstRamp.segment_id, side: _xwFirstRamp.side,
      position: _xwFirstRamp.position, index: _xwFirstRamp.index,
    },
    ramp_b: {
      segment_id: rampData.segment_id, side: rampData.side,
      position: rampData.position, index: rampData.index,
    },
  });

  _xwFirstRamp = null;
  setStatus('Crosswalk drawn (unsaved)');
}

function _xwMouseMove(e) {
  if (!_xwFirstRamp) return;
  if (_xwPreviewLine) map.removeLayer(_xwPreviewLine);
  _xwPreviewLine = L.polyline([_xwFirstRamp.latlng, e.latlng], {
    color: '#ff00ff', weight: 2, opacity: 0.5, dashArray: '4 4',
  }).addTo(map);
}

// ── Move endpoint ─────────────────────────────────────────────────────────────
let _dragNode = null;
let _dragSegments = new Map();
let _dragGhostMarker = null;

function handleNodeClickForMove(nodeId, latlng) {
  if (_editorMode !== 'move_endpoint') return;

  if (_dragNode && _dragNode.nodeId === nodeId) {
    _finishDrag(false);
    return;
  }

  if (_dragNode) _finishDrag(false);

  _dragNode = {
    nodeId,
    origLatlng: L.latLng(latlng[0], latlng[1]),
    origUtm: proj4('EPSG:4326', 'EPSG:32610', [latlng[1], latlng[0]]),
  };

  _dragGhostMarker = L.circleMarker(latlng, {
    radius: 6, color: '#888', fillColor: '#ccc', fillOpacity: 0.5, weight: 1,
    dashArray: '3 3',
  }).bindTooltip('Original position').addTo(lg.editor);

  _showSegmentSelectionPanel(nodeId, latlng);

  const nodePt = pointIndex.get(`node_${nodeId}`);
  if (nodePt && nodePt.layer) {
    nodePt.layer.setStyle({ color: '#eab308', fillColor: '#eab308' });
    map.on('mousemove', _dragMouseMove);
    map.once('click', _dragMouseClick);
  }
  setStatus('Drag to move endpoint. Click to place.');
}

function _dragMouseMove(e) {
  if (!_dragNode) return;
  const nodePt = pointIndex.get(`node_${_dragNode.nodeId}`);
  if (nodePt && nodePt.layer) {
    nodePt.layer.setLatLng(e.latlng);
  }
}

function _dragMouseClick(e) {
  if (!_dragNode) return;
  map.off('mousemove', _dragMouseMove);

  const newUtm = proj4('EPSG:4326', 'EPSG:32610', [e.latlng.lng, e.latlng.lat]);
  const rubberBandSegs = [];
  _dragSegments.forEach((seg, segId) => {
    if (seg.checked) rubberBandSegs.push(segId);
  });

  recordEdit('move_endpoint', {
    node_id: _dragNode.nodeId,
    new_x: newUtm[0],
    new_y: newUtm[1],
    rubber_band_segments: rubberBandSegs,
  });

  const nodePt = pointIndex.get(`node_${_dragNode.nodeId}`);
  if (nodePt && nodePt.layer) {
    nodePt.layer.setLatLng(e.latlng);
    nodePt.layer.setStyle({ color: '#eab308', fillColor: '#eab308' });
  }

  _finishDrag(true);
  setStatus('Endpoint moved (unsaved)');
}

function _finishDrag(keepVisuals) {
  map.off('mousemove', _dragMouseMove);
  if (!keepVisuals) {
    if (_dragNode) {
      const nodePt = pointIndex.get(`node_${_dragNode.nodeId}`);
      if (nodePt && nodePt.layer) {
        nodePt.layer.setLatLng(_dragNode.origLatlng);
        nodePt.layer.setStyle({ color: C.node, fillColor: C.node });
      }
    }
    if (_dragGhostMarker) { lg.editor.removeLayer(_dragGhostMarker); _dragGhostMarker = null; }
  }
  _dragSegments.clear();
  _dragNode = null;
  document.getElementById('px-probe-segs').innerHTML = '';
}

function _showSegmentSelectionPanel(nodeId, latlng) {
  const probePanel = document.getElementById('px-probe');
  const segList    = document.getElementById('px-probe-segs');
  probePanel.style.display = 'block';

  const nearby = probeSegments(L.latLng(latlng[0], latlng[1]), 30);
  _dragSegments.clear();
  const html = nearby.map(f => {
    _dragSegments.set(f.key, { checked: true, layer: f.entry.layer, origCoords: null });
    const safeKey = f.key.replace(/[^a-zA-Z0-9_]/g, '_');
    return '<div style="display:flex;align-items:center;gap:4px;padding:3px 2px;border-bottom:1px solid #f0f0f0;font-size:11px;">' +
      `<input type="checkbox" id="px-rb-${safeKey}" checked onchange="toggleRubberBand('${f.key}', this.checked)">` +
      `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.entry.label || f.key}</span>` +
      `<span style="color:#888;">${Math.round(f.dist)}m</span>` +
    '</div>';
  }).join('');
  segList.innerHTML = html || '<div style="color:#999;font-size:11px;padding:4px 2px;">No nearby segments</div>';
}

// ── Popup builder (matches generate_map style) ────────────────────────────────
function makePopup(title, attrs) {
  const fmt = v => (v == null || String(v).trim() === '' || String(v) === 'nan' || String(v) === 'None')
    ? '<i>—</i>' : v;
  const rows = attrs.map(([k,v]) =>
    `<tr><td style="padding:2px 8px 2px 0;color:#555;white-space:nowrap"><b>${k}</b></td>` +
    `<td style="padding:2px 0">${fmt(v)}</td></tr>`).join('');
  return `<div style="font-family:sans-serif;font-size:12px;min-width:180px">` +
         `<b style="font-size:13px">${title}</b>` +
         `<table style="border-collapse:collapse;margin-top:4px">${rows}</table></div>`;
}

// ── Coordinate on click ────────────────────────────────────────────────────────
const _coordBox = document.getElementById('px-coords');
map.on('click', e => {
  _coordBox.style.display = 'block';
  _coordBox.textContent = e.latlng.lat.toFixed(7) + ', ' + e.latlng.lng.toFixed(7);

  if (_editorMode === 'add_node') {
    handleAddNode(e.latlng);
    return;
  }
  if (_editorMode === 'draw_crosswalk') {
    // handled by ramp marker click, not map click
  }
  if (_probeActive) {
    const r = parseInt(_probeRadiusInput.value, 10);
    renderProbe(probeSegments(e.latlng, r), probePoints(e.latlng, r));
  }
});
map.on('contextmenu', () => { _coordBox.style.display = 'none'; });

function handleAddNode(latlng) {
  const utm = proj4('EPSG:4326', 'EPSG:32610', [latlng.lng, latlng.lat]);
  const marker = L.circleMarker(latlng, {
    radius: 7, color: '#16a34a', fillColor: '#16a34a', fillOpacity: 0.7,
    weight: 2, className: 'px-pulse',
  }).bindTooltip('New node (unsaved)')
    .addTo(lg.editor);

  recordEdit('add_node', { x: utm[0], y: utm[1] });
  setStatus(`Node added at UTM (${utm[0].toFixed(1)}, ${utm[1].toFixed(1)})`);
}

// ── Hull and slot fetching (from server, zoom-gated) ─────────────────────────
let _hullFetchTimer = null;

async function fetchHullsAndSlots() {
  if (map.getZoom() < 17) {
    HULL_FC.features = [];
    SLOT_FC.features = [];
    renderHullsAndSlots();
    return;
  }
  const b = map.getBounds();
  const url = `/hulls/${encodeURIComponent(PARQUET_FILE)}` +
    `?min_lon=${b.getWest()}&min_lat=${b.getSouth()}` +
    `&max_lon=${b.getEast()}&max_lat=${b.getNorth()}`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`/hulls returned ${resp.status}`);
    const data = await resp.json();
    HULL_FC.features = data.hulls || [];
    SLOT_FC.features = data.slots || [];
  } catch (e) {
    console.warn('[ProximityEditor] Hull fetch failed:', e);
    HULL_FC.features = [];
    SLOT_FC.features = [];
  }
  renderHullsAndSlots();
}

// ── Hull and slot rendering (from in-memory FC, viewport-filtered) ────────────
function renderHullsAndSlots() {
  lg.hulls.clearLayers();
  lg.slots.clearLayers();
  if (map.getZoom() < 17) return;
  L.geoJSON({ type: 'FeatureCollection', features: HULL_FC.features }, {
    style: () => ({ color: '#b45309', weight: 1.5, opacity: 0.8, fill: true, fillColor: '#fbbf24', fillOpacity: 0.15 }),
    onEachFeature: (f, l) => l.bindTooltip(f.properties.tip),
  }).addTo(lg.hulls);
  L.geoJSON({ type: 'FeatureCollection', features: SLOT_FC.features }, {
    style: () => ({ color: '#0891b2', weight: 1.5, opacity: 0.8, fill: true, fillColor: '#7dd3fc', fillOpacity: 0.2 }),
    onEachFeature: (f, l) => l.bindTooltip(f.properties.tip),
  }).addTo(lg.slots);
}

// ── Layer rendering ───────────────────────────────────────────────────────────
function clearAll() {
  ['streets','bk_sep','bk_off','sw_sep','sw_off','nodes','ramps','calm'].forEach(k => lg[k].clearLayers());
  segIndex.clear();
  nodeIndex.clear();
  pointIndex.clear();
}

function midLatLon(geojson) {
  const coords = geojson.type === 'LineString'      ? geojson.coordinates
               : geojson.type === 'MultiLineString' ? geojson.coordinates.flat()
               : geojson.type === 'Point'           ? [geojson.coordinates]
               : geojson.type === 'MultiPoint'      ? geojson.coordinates
               : [];
  if (!coords.length) return [0, 0];
  const mid = coords[Math.floor(coords.length / 2)];
  return [mid[1], mid[0]];  // [lat, lon]
}

function renderRows(rows, tier) {
  clearAll();
  for (const r of rows) {
    // ── Streets ──────────────────────────────────────────────────────────────
    if (r.street_geom) {
      let g;
      try { g = xfGeom(JSON.parse(String(r.street_geom))); }
      catch (e) { console.warn('[ProximityEditor] street_geom parse error:', e, 'raw:', r.street_geom); continue; }
      if (!g) continue;
      const col  = inclineColor(C.street, r.street_incline);
      const opts = { style: () => ({ color: col, weight: tier >= 2 ? 2 : 1.5, opacity: 0.8 }) };
      const layer = L.geoJSON(g, opts);
      if (tier >= 2) {
        layer.bindTooltip(String(r.name || r.highway || ''));
        layer.bindPopup(makePopup('Street', [
          ['Name',      r.name],       ['Highway',  r.highway],
          ['Grid ID',   r.street_grid_id], ['Incline', r.street_incline],
          ['Lanes',     r.lanes],       ['Surface',  r.surface],
          ['Max speed', r.maxspeed],    ['Oneway',   r.oneway],
        ]));
        const mid = midLatLon(g);
        segIndex.set(String(r.street_grid_id), { layer, mid, baseColor: col, baseWeight: 2, label: String(r.name || r.highway || r.street_grid_id) });
      }
      layer.addTo(lg.streets);
    }

    if (tier >= 2) {
      // ── Bikeways ────────────────────────────────────────────────────────────
      for (const [key, side, idx] of [
        ['bk_l1_geom','left',1], ['bk_l2_geom','left',2],
        ['bk_r1_geom','right',1],['bk_r2_geom','right',2],
      ]) {
        if (!r[key]) continue;
        const isOff = r[`bikeway_${side}_${idx}_offset`] === 'yes';
        const base  = isOff ? C.bk_off : C.bk_sep;
        const col   = inclineColor(base, r[`bikeway_${side}_${idx}_incline`]);
        let g; try { g = xfGeom(JSON.parse(String(r[key]))); } catch(_) { continue; } if (!g) continue;
        const bkMid = midLatLon(g);
        const bkKey = `bk_${side}_${idx}_${r.street_grid_id}`;
        const layer = L.geoJSON(g, { style: () => ({ color: col, weight: 2, opacity: 0.85 }) })
          .bindTooltip(`Bikeway ${side}-${idx}: ${r[`bikeway_${side}_${idx}_type`] || ''}`)
          .bindPopup(makePopup(`Bikeway (${side} ${idx})`, [
            ['Type',      r[`bikeway_${side}_${idx}_type`]],
            ['Offset',    r[`bikeway_${side}_${idx}_offset`]],
            ['Width (m)', r[`bikeway_${side}_${idx}_width`]],
            ['Surface',   r[`bikeway_${side}_${idx}_surface`]],
            ['Incline',   r[`bikeway_${side}_${idx}_incline`]],
            ['Permitted', r[`bikeway_${side}_${idx}_permitted`]],
            ['Separator', r[`bikeway_${side}_${idx}_seperator`]],
            ['Street',    r.name],
          ]));
        segIndex.set(bkKey, { layer, mid: bkMid, baseColor: col, baseWeight: 2, label: `Bikeway ${side}-${idx}: ${r[`bikeway_${side}_${idx}_type`] || ''} (${r.name || ''})` });
        layer.addTo(isOff ? lg.bk_off : lg.bk_sep);
      }
    }

    if (tier >= 3) {
      // ── Sidewalks ────────────────────────────────────────────────────────────
      for (const [key, side] of [['sw_l_geom','left'],['sw_r_geom','right']]) {
        if (!r[key]) continue;
        const isOff = r[`sidewalk_${side}_offset`] === 'yes';
        const base  = isOff ? C.sw_off : C.sw_sep;
        const col   = inclineColor(base, r[`sidewalk_${side}_incline`]);
        let g; try { g = xfGeom(JSON.parse(String(r[key]))); } catch(_) { continue; } if (!g) continue;
        const layer = L.geoJSON(g, { style: () => ({ color: col, weight: 2, opacity: 0.85 }) })
          .bindTooltip(`Sidewalk ${side}: presence=${r[`sidewalk_${side}_presence`] || ''}`)
          .bindPopup(makePopup(`Sidewalk (${side})`, [
            ['ID',        r[`sidewalk_${side}_ID`]],
            ['Presence',  r[`sidewalk_${side}_presence`]],
            ['Surface',   r[`sidewalk_${side}_surface`]],
            ['Quality',   r[`sidewalk_${side}_quality`]],
            ['Width (m)', r[`sidewalk_${side}_width`]],
            ['Incline',   r[`sidewalk_${side}_incline`]],
            ['Separator', r[`sidewalk_${side}_seperator`]],
            ['Offset',    r[`sidewalk_${side}_offset`]],
            ['Street',    r.name],
          ]));
        const mid = midLatLon(g);
        const swId = String(r[`sidewalk_${side}_ID`] || '');
        if (swId) segIndex.set(swId, { layer, mid, baseColor: col, baseWeight: 2, label: `Sidewalk ${side}: ${r.name || swId}` });
        layer.addTo(isOff ? lg.sw_off : lg.sw_sep);
      }

      // ── Crosswalks ────────────────────────────────────────────────────────────
      for (const [geoKey, pos] of [['xw_start_geom','start'],['xw_end_geom','end']]) {
        if (!r[geoKey]) continue;
        let g; try { g = xfGeom(JSON.parse(String(r[geoKey]))); } catch(_) { continue; } if (!g) continue;
        const xwMid = midLatLon(g);
        const xwId  = String(r[`crosswalk_${pos}_id`] || `xw_${pos}_${r.street_grid_id}`);
        const xwLayer = L.geoJSON(g, { style: () => ({ color: C.cross, weight: 2, opacity: 0.8 }) })
          .bindTooltip(`Crosswalk ${pos}`)
          .bindPopup(makePopup(`Crosswalk (${pos})`, [
            ['ID',         r[`crosswalk_${pos}_id`]],
            ['Type',       r[`crosswalk_${pos}_type`]],
            ['Controlled', r[`crosswalk_${pos}_controlled`]],
            ['Marked',     r[`crosswalk_${pos}_marked`]],
            ['Signals',    r[`crosswalk_${pos}_signals`]],
          ]))
          .addTo(lg.streets);
        segIndex.set(xwId, { layer: xwLayer, mid: xwMid, baseColor: C.cross, baseWeight: 2, label: `Crosswalk ${pos}: ${r[`crosswalk_${pos}_type`] || ''} (${r.name || ''})` });
      }

      // ── Curb returns ──────────────────────────────────────────────────────────
      if (r.curb_return_geom) {
        let g; try { g = xfGeom(JSON.parse(String(r.curb_return_geom))); } catch(_) { g = null; }
        if (!g) { /* skip */ } else
        L.geoJSON(g, { style: () => ({ color: C.cret, weight: 2, opacity: 0.7 }) })
          .addTo(lg.streets);
      }

      // ── Traffic calming ───────────────────────────────────────────────────────
      if (r.feat_geom && r.street_feature_types) {
        try {
          const g     = xfGeom(JSON.parse(String(r.feat_geom)));
          const types = JSON.parse(r.street_feature_types.replace(/'/g, '"'));
          const attrs = r.street_feature_attributes
            ? JSON.parse(r.street_feature_attributes.replace(/'/g, '"')) : [];
          const coords = g.type === 'MultiPoint' ? g.coordinates : [g.coordinates];
          coords.forEach((c, i) => {
            if (!String(types[i] || '').startsWith('traffic_calming')) return;
            L.circleMarker([c[1], c[0]], {
              radius: 5, color: C.calm, fillColor: C.calm, fillOpacity: 0.85, weight: 1.5,
            })
              .bindTooltip(`Traffic calming: ${types[i]}`)
              .bindPopup(makePopup('Traffic Calming', [
                ['Street', r.name], ['Type', types[i]],
                ...(typeof attrs[i] === 'object' && attrs[i]
                    ? Object.entries(attrs[i]) : []),
              ]))
              .addTo(lg.calm);
          });
        } catch(_) {}
      }
    }

    if (tier >= 4) {
      // ── Intersection nodes ────────────────────────────────────────────────────
      for (const [key, idField, intField] of [
        ['start_node_geom', 'start_node_id', 'start_node_is_intersection_node'],
        ['end_node_geom',   'end_node_id',   'end_node_is_intersection_node'],
      ]) {
        if (!r[key] || !r[intField]) continue;
        let g; try { g = xfGeom(JSON.parse(String(r[key]))); } catch(_) { continue; } if (!g) continue;
        const mid = [g.coordinates[1], g.coordinates[0]];
        const nid = String(r[idField]);
        if (!nodeIndex.has(nid)) {
          const nodeMk = L.circleMarker(mid, {
            radius: 4, color: C.node, fillColor: C.node, fillOpacity: 0.9, weight: 1,
          })
            .bindTooltip(`Node ${nid}`)
            .addTo(lg.nodes);
          nodeIndex.set(nid, { mid });
          pointIndex.set(`node_${nid}`, { layer: nodeMk, lat: mid[0], lon: mid[1], label: `Node ${nid}`, baseColor: C.node, baseRadius: 4 });

          // ── Context menu: consolidation ──
          nodeMk.on('contextmenu', function(ev) {
            L.DomEvent.stopPropagation(ev);
            L.DomEvent.preventDefault(ev);
            const items = [
              {
                label: _consolidationSelected.has(nid)
                  ? '&#10003; Deselect for consolidation'
                  : 'Select for consolidation',
                action: () => toggleConsolidationSelect(nid, null, L.latLng(mid[0], mid[1]))
              },
            ];
            if (_consolidationSelected.size >= 1) {
              items.push({
                label: `Consolidate (${_consolidationSelected.size + (_consolidationSelected.has(nid) ? 0 : 1)} nodes)`,
                action: () => {
                  if (!_consolidationSelected.has(nid)) toggleConsolidationSelect(nid, null, L.latLng(mid[0], mid[1]));
                  doConsolidate();
                }
              });
            }
            showContextMenu(ev.originalEvent.clientX, ev.originalEvent.clientY, items);
          });

          // ── Click: move mode ──
          nodeMk.on('click', function(ev) {
            L.DomEvent.stopPropagation(ev);
            if (_editorMode === 'move_endpoint') {
              handleNodeClickForMove(nid, mid);
            }
          });
        }
      }
    }

    if (tier >= 5) {
      // ── Curb ramps ────────────────────────────────────────────────────────────
      for (const s of ['left','right']) for (const p of ['start','end']) for (const i of [1,2,3]) {
        const key  = `cr_${s}_${p}_${i}_geom`;
        if (!r[key]) continue;
        const base = `sidewalk_${s}_curbramp_${p}_${i}`;
        let g; try { g = xfGeom(JSON.parse(String(r[key]))); } catch(_) { continue; } if (!g) continue;
        const mid  = [g.coordinates[1], g.coordinates[0]];
        const rloc = r[`${base}_returnloc`];
        const rpos = r[`${base}_returnposition`];
        const rampKey = `ramp_${s}_${p}_${i}_${r.street_grid_id}`;
        const segId = String(r.street_grid_id);
        const rampMk = L.circleMarker(mid, {
          radius: 5, color: C.ramp, fillColor: C.ramp, fillOpacity: 0.9, weight: 1,
        })
          .bindTooltip(`Curb ramp ${s}-${p}-${i}: loc=${rloc || ''}, pos=${rpos || ''}`)
          .bindPopup(makePopup(`Curb Ramp (${s} ${p} #${i})`, [
            ['ID',               r[`${base}_ID`]],
            ['Side',             s],
            ['Position',         p],
            ['Index',            i],
            ['Return direction', rloc],
            ['Return position',  rpos],
            ['Condition score',  r[`${base}_condition_score`]],
            ['Street',           r.name],
          ]))
          .addTo(lg.ramps);
        pointIndex.set(rampKey, { layer: rampMk, lat: mid[0], lon: mid[1], label: `Ramp ${s}-${p}-${i} (${r.name || ''})`, baseColor: C.ramp, baseRadius: 5 });

        // ── Context menu: toggle curb ramp ──
        rampMk.on('contextmenu', function(ev) {
          L.DomEvent.stopPropagation(ev);
          L.DomEvent.preventDefault(ev);
          const isDisabled = rampMk._pxDisabled || false;
          const items = [{
            label: isDisabled ? 'Enable curb ramp' : 'Disable curb ramp',
            action: () => {
              const nowDisabled = !rampMk._pxDisabled;
              rampMk._pxDisabled = nowDisabled;
              rampMk.setStyle(nowDisabled
                ? { color: '#999', fillColor: '#999', fillOpacity: 0.4 }
                : { color: C.ramp, fillColor: C.ramp, fillOpacity: 0.9 });
              recordEdit('toggle_curb_ramp', {
                segment_id: segId, side: s, position: p,
                index: i, enabled: isDisabled
              });
            }
          }];
          showContextMenu(ev.originalEvent.clientX, ev.originalEvent.clientY, items);
        });

        // ── Click: crosswalk draw mode ──
        rampMk.on('click', function(ev) {
          L.DomEvent.stopPropagation(ev);
          if (_editorMode === 'draw_crosswalk') {
            handleRampClickForCrosswalk(
              { segment_id: segId, side: s, position: p, index: i },
              [mid[0], mid[1]]
            );
          }
        });
      }
    }
  }
}

// ── SQL builder ───────────────────────────────────────────────────────────────
function buildSQL(tier, bounds) {
  const wkb  = (col, alias) =>
    `CASE WHEN ${col} IS NOT NULL THEN ST_AsGeoJSON(${col}) END AS ${alias}`;
  const bk   = (s, n) => wkb(`bikeway_${s}_${n}_geometry`,             `bk_${s[0]}${n}_geom`);
  const sw   = s      => wkb(`sidewalk_${s}_geometry`,                  `sw_${s[0]}_geom`);
  const xw   = p      => wkb(`crosswalk_${p}_geometry`,                 `xw_${p}_geom`);
  const nd   = s      => wkb(`${s}_node_geometry`,                      `${s}_node_geom`);
  const cr   = (s,p,i)=> wkb(`sidewalk_${s}_curbramp_${p}_${i}_geometry`,`cr_${s}_${p}_${i}_geom`);

  const cols = [
    'street_grid_id', 'highway',
    'ST_AsGeoJSON(street_geometry) AS street_geom',
  ];

  if (tier >= 2) {
    cols.push(
      'name','lanes','lane_width','surface','maxspeed','oneway','street_incline',
      ...['left','right'].flatMap(s => [1,2].flatMap(n => [
        `bikeway_${s}_${n}_type`,`bikeway_${s}_${n}_offset`,`bikeway_${s}_${n}_incline`,
        `bikeway_${s}_${n}_permitted`,`bikeway_${s}_${n}_width`,`bikeway_${s}_${n}_seperator`,
        bk(s, n),
      ]))
    );
  }

  if (tier >= 3) {
    cols.push(
      ...['left','right'].flatMap(s => [
        `sidewalk_${s}_ID`,`sidewalk_${s}_presence`,`sidewalk_${s}_surface`,
        `sidewalk_${s}_quality`,`sidewalk_${s}_width`,`sidewalk_${s}_incline`,
        `sidewalk_${s}_seperator`,`sidewalk_${s}_offset`, sw(s),
      ]),
      ...['start','end'].flatMap(p => [
        `crosswalk_${p}_id`,`crosswalk_${p}_type`,`crosswalk_${p}_controlled`,
        `crosswalk_${p}_marked`,`crosswalk_${p}_signals`, xw(p),
      ]),
      wkb('curb_return_geometry', 'curb_return_geom'),
      'street_feature_types','street_feature_attributes',
      wkb('street_feature_geometry','feat_geom'),
      'sidewalk_left_feature_types',
      wkb('sidewalk_left_feature_geometry','sw_l_feat_geom'),
      'sidewalk_right_feature_types',
      wkb('sidewalk_right_feature_geometry','sw_r_feat_geom'),
    );
  }

  if (tier >= 4) {
    cols.push(
      'start_node_id','start_node_is_intersection_node', nd('start'),
      'end_node_id',  'end_node_is_intersection_node',   nd('end'),
    );
  }

  if (tier >= 5) {
    for (const s of ['left','right'])
      for (const p of ['start','end'])
        for (const i of [1,2,3]) {
          const base = `sidewalk_${s}_curbramp_${p}_${i}`;
          cols.push(
            `${base}_ID`,`${base}_returnloc`,`${base}_returnposition`,`${base}_condition_score`,
            cr(s, p, i),
          );
        }
  }

  const hwClause   = tier <= 2 ? `regexp_matches(highway, '${HW_RE[tier]}')` : null;
  let   bboxClause = null;
  if (tier >= 2) {
    const { minX, minY, maxX, maxY } = viewportToBBox(bounds);
    bboxClause = `ST_Intersects(street_geometry, ST_MakeEnvelope(${minX}, ${minY}, ${maxX}, ${maxY}))`;
  }
  const where = [hwClause, bboxClause].filter(Boolean).join(' AND ') || 'true';

  return `SELECT ${cols.join(', ')} FROM read_parquet('network.parquet') WHERE ${where}`;
}

// ── DuckDB init ───────────────────────────────────────────────────────────────
let conn          = null;
let _refreshTimer = null;

async function initDuckDB() {
  try {
    setStatus('Loading DuckDB WASM…');
    const bundles  = duckdb.getJsDelivrBundles();
    const bundle   = await duckdb.selectBundle(bundles);
    const workerUrl = URL.createObjectURL(
      new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' })
    );
    const worker = new Worker(workerUrl);
    const db     = new duckdb.AsyncDuckDB(new duckdb.VoidLogger(), worker);
    await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
    URL.revokeObjectURL(workerUrl);
    await db.registerFileURL('network.parquet', PARQUET_URL, duckdb.DuckDBDataProtocol.HTTP, true);
    conn = await db.connect();
    setStatus('Loading spatial extension…');
    await conn.query('INSTALL spatial; LOAD spatial;');
    // Verify geometry column is readable
    try {
      const typeCheck = await conn.query(
        `SELECT typeof(street_geometry) AS t FROM read_parquet('network.parquet') LIMIT 1`
      );
      const geomType = typeCheck.toArray()[0]?.toJSON()?.t ?? 'unknown';
      console.log('[ProximityEditor] street_geometry type:', geomType);
      if (!geomType.includes('GEOMETRY') && !geomType.includes('BLOB')) {
        console.warn('[ProximityEditor] Unexpected geometry column type:', geomType);
      }
    } catch (typeErr) {
      console.warn('[ProximityEditor] Type check failed:', typeErr);
    }
    setStatus('Ready — loading streets…');
    await refreshMap();
  } catch (e) {
    showError(
      'DuckDB failed to load. Ensure you have internet access and are serving via ' +
      'http://, not file://. Error: ' + e.message
    );
  }
}

async function refreshMap() {
  if (!conn) return;
  const zoom   = map.getZoom();
  const tier   = getTier(zoom);
  const bounds = map.getBounds();
  setStatus(`Loading tier ${tier}…`);
  try {
    const sql = buildSQL(tier, bounds);
    console.log('[ProximityEditor] SQL tier', tier, ':', sql.slice(0, 300));
    const result = await conn.query(sql);
    const rows   = result.toArray().map(r => r.toJSON());
    if (rows.length > 0) {
      const sample = rows[0];
      console.log('[ProximityEditor] First row keys:', Object.keys(sample));
      console.log('[ProximityEditor] street_geom type:', typeof sample.street_geom,
                  'value:', String(sample.street_geom).slice(0, 80));
    }
    setStatus(`Rendering ${rows.length} segments…`);
    renderRows(rows, tier);
    setStatus(`Tier ${tier} · ${rows.length} segments`);
  } catch (e) {
    const msg = e?.message || String(e);
    showError('Query error (tier ' + tier + '): ' + msg);
    console.error('[ProximityEditor] Query error:', e);
  }
}

map.on('zoomend moveend', () => {
  clearTimeout(_refreshTimer);
  _refreshTimer = setTimeout(() => { refreshMap(); fetchHullsAndSlots(); }, 300);
});

// ── Search ────────────────────────────────────────────────────────────────────
let _flashTimer = null;

function pxSearch() {
  const id    = document.getElementById('px-search-input').value.trim();
  const el    = document.getElementById('px-search-status');
  const idx   = _pxMode === 'seg' ? segIndex : nodeIndex;
  const entry = idx.get(id);
  if (!entry) {
    el.style.color = '#c00'; el.textContent = 'Not found: ' + id; return;
  }
  el.style.color = '#555'; el.textContent = '\u2192 Found: ' + id;
  map.flyTo(entry.mid, 20);
  if (entry.layer) {
    clearTimeout(_flashTimer);
    try { entry.layer.setStyle({ color: '#ffff00', weight: (entry.baseWeight || 2) * 2.5 }); } catch(_) {}
    _flashTimer = setTimeout(() => {
      try { entry.layer.setStyle({ color: entry.baseColor, weight: entry.baseWeight }); } catch(_) {}
    }, 2500);
    try { entry.layer.openPopup(entry.mid); } catch(_) {}
  }
}

function pxSetMode(mode) {
  _pxMode = mode;
  const s = document.getElementById('px-mode-seg');
  const n = document.getElementById('px-mode-node');
  s.style.background = mode === 'seg'  ? '#1a73e8' : 'white';
  s.style.color       = mode === 'seg'  ? 'white'   : '#333';
  n.style.background = mode === 'node' ? '#1a73e8' : 'white';
  n.style.color       = mode === 'node' ? 'white'   : '#333';
  document.getElementById('px-search-input').placeholder =
    mode === 'seg' ? 'e.g. 12_34_0' : 'e.g. 123456789';
  document.getElementById('px-search-status').textContent = '';
}

document.getElementById('px-mode-seg').onclick  = () => pxSetMode('seg');
document.getElementById('px-mode-node').onclick = () => pxSetMode('node');

// ── Probe ─────────────────────────────────────────────────────────────────────
let _probeActive = false;
const _probeTimerSeg = {};
const _probeTimerPt  = {};
const _hiddenSeg     = {};
const _hiddenPt      = {};

function haverDist(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

function probeSegments(latlng, radiusM) {
  const found = [];
  segIndex.forEach((e, key) => {
    const d = haverDist(latlng.lat, latlng.lng, e.mid[0], e.mid[1]);
    if (d <= radiusM) found.push({ key, dist: d, entry: e });
  });
  found.sort((a, b) => a.dist - b.dist);
  return found;
}

function probePoints(latlng, radiusM) {
  const found = [];
  pointIndex.forEach((e, key) => {
    const d = haverDist(latlng.lat, latlng.lng, e.lat, e.lon);
    if (d <= radiusM) found.push({ key, dist: d, entry: e });
  });
  found.sort((a, b) => a.dist - b.dist);
  return found;
}

function flashFeature(key, kind) {
  if (kind === 'seg') {
    const e = segIndex.get(key); if (!e || !e.layer) return;
    if (_probeTimerSeg[key]) clearTimeout(_probeTimerSeg[key]);
    try { e.layer.setStyle({ color: '#ff4400', weight: e.baseWeight * 3 }); } catch(_) {}
    _probeTimerSeg[key] = setTimeout(() => {
      try { e.layer.setStyle({ color: e.baseColor, weight: e.baseWeight }); } catch(_) {}
    }, 2500);
  } else {
    const e = pointIndex.get(key); if (!e || !e.layer) return;
    if (_probeTimerPt[key]) clearTimeout(_probeTimerPt[key]);
    try { e.layer.setStyle({ color: '#ff4400', fillColor: '#ff4400', radius: e.baseRadius * 2.5 }); } catch(_) {}
    _probeTimerPt[key] = setTimeout(() => {
      try { e.layer.setStyle({ color: e.baseColor, fillColor: e.baseColor, radius: e.baseRadius }); } catch(_) {}
    }, 2500);
  }
}

function toggleHide(key, kind) {
  const safeKey = key.replace(/[^a-zA-Z0-9_]/g, '_');
  const btn = document.getElementById('px-hide-' + kind + '-' + safeKey);
  if (kind === 'seg') {
    const e = segIndex.get(key); if (!e || !e.layer) return;
    if (_hiddenSeg[key]) {
      try { e.layer.setStyle({ color: e.baseColor, weight: e.baseWeight, opacity: 0.8 }); } catch(_) {}
      delete _hiddenSeg[key];
      if (btn) btn.textContent = 'Hide';
    } else {
      try { e.layer.setStyle({ opacity: 0, weight: 0 }); } catch(_) {}
      _hiddenSeg[key] = true;
      if (btn) btn.textContent = 'Show';
    }
  } else {
    const e = pointIndex.get(key); if (!e || !e.layer) return;
    if (_hiddenPt[key]) {
      try { e.layer.setStyle({ color: e.baseColor, fillColor: e.baseColor, fillOpacity: 0.9, opacity: 1, radius: e.baseRadius }); } catch(_) {}
      delete _hiddenPt[key];
      if (btn) btn.textContent = 'Hide';
    } else {
      try { e.layer.setStyle({ opacity: 0, fillOpacity: 0 }); } catch(_) {}
      _hiddenPt[key] = true;
      if (btn) btn.textContent = 'Show';
    }
  }
}

function _probeRow(key, dist, entry, kind) {
  const safeKey = key.replace(/[^a-zA-Z0-9_]/g, '_');
  const isHidden = kind === 'seg' ? !!_hiddenSeg[key] : !!_hiddenPt[key];
  return '<div style="display:flex;align-items:center;gap:4px;padding:3px 2px;border-bottom:1px solid #f0f0f0;font-size:11px;">' +
    '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;flex-shrink:0;background:' + (entry.baseColor || '#888') + ';"></span>' +
    '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (entry.label || key) + '">' + (entry.label || key) + '</span>' +
    '<span style="color:#888;flex-shrink:0;">' + Math.round(dist) + 'm</span>' +
    `<button onclick="flashFeature('${key}','${kind}')" style="padding:1px 5px;font-size:10px;cursor:pointer;border:1px solid #ccc;border-radius:3px;">Flash</button>` +
    `<button id="px-hide-${kind}-${safeKey}" onclick="toggleHide('${key}','${kind}')" style="padding:1px 5px;font-size:10px;cursor:pointer;border:1px solid #ccc;border-radius:3px;">${isHidden ? 'Show' : 'Hide'}</button>` +
    '</div>';
}

function renderProbe(segResults, ptResults) {
  const panel   = document.getElementById('px-probe');
  const segList = document.getElementById('px-probe-segs');
  const ptList  = document.getElementById('px-probe-pts');
  segList.innerHTML = segResults.length
    ? segResults.map(f => _probeRow(f.key, f.dist, f.entry, 'seg')).join('')
    : '<div style="color:#999;font-size:11px;padding:4px 2px;">No segments found</div>';
  ptList.innerHTML  = ptResults.length
    ? ptResults.map(f => _probeRow(f.key, f.dist, f.entry, 'pt')).join('')
    : '<div style="color:#999;font-size:11px;padding:4px 2px;">No points found</div>';
  panel.style.display = 'block';
}

function _setProbeActive(active) {
  _probeActive = active;
  const btn = document.getElementById('px-probe-toggle');
  btn.style.background  = active ? '#1a73e8' : 'white';
  btn.style.color       = active ? 'white'   : '#333';
  btn.style.borderColor = active ? '#1a73e8' : '#aaa';
  btn.textContent       = active ? '\u{1F50D} Probe ON \u2014 click map' : '\u{1F50D} Probe';
  if (!active) document.getElementById('px-probe').style.display = 'none';
}

document.getElementById('px-probe-toggle').addEventListener('click', e => {
  e.stopPropagation();
  _setProbeActive(!_probeActive);
});

document.getElementById('px-probe-close').addEventListener('click', () => _setProbeActive(false));

const _probeRadiusInput = document.getElementById('px-probe-radius');
const _probeRadiusVal   = document.getElementById('px-probe-radius-val');

// ── Changeset panel rendering ────────────────────────────────────────────────
function renderChangesetPanel(cs) {
  const counts = document.getElementById('px-cs-counts');
  const stage  = document.getElementById('px-cs-stage');
  const e = cs.edits;
  const parts = [];
  if (e.added_nodes.length)        parts.push(`${e.added_nodes.length} node(s) added`);
  if (e.consolidated_hulls.length)  parts.push(`${e.consolidated_hulls.length} hull consolidation(s)`);
  if (e.moved_endpoints.length)     parts.push(`${e.moved_endpoints.length} endpoint(s) moved`);
  if (e.toggled_curb_ramps.length)  parts.push(`${e.toggled_curb_ramps.length} ramp(s) toggled`);
  if (e.drawn_crosswalks.length)    parts.push(`${e.drawn_crosswalks.length} crosswalk(s) drawn`);
  counts.textContent = parts.length ? parts.join(', ') : 'No edits';
  stage.textContent  = cs.dirty_from_stage !== null
    ? `Pipeline from: ${STAGE_NAMES[cs.dirty_from_stage]}`
    : '';
}

function computeEditBBox(cs) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  function expand(x, y) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  for (const n of cs.edits.added_nodes) expand(n.x, n.y);
  for (const m of cs.edits.moved_endpoints) expand(m.new_x, m.new_y);
  // For ramps/crosswalks, use the map center as fallback (they reference existing features)
  if (minX === Infinity) {
    const c = map.getCenter();
    const utm = proj4('EPSG:4326', 'EPSG:32610', [c.lng, c.lat]);
    expand(utm[0] - 100, utm[1] - 100);
    expand(utm[0] + 100, utm[1] + 100);
  }
  return { minX, minY, maxX, maxY };
}

async function doSave() {
  if (changeset.dirty_from_stage === null) {
    setStatus('No edits to save'); return;
  }
  const spinner = document.getElementById('px-cs-spinner');
  spinner.style.display = 'block';
  setStatus('Saving edits\u2026');
  try {
    const bbox = computeEditBBox(changeset);
    const resp = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        parquet: changeset.parquet,
        dirty_from_stage: changeset.dirty_from_stage,
        bbox,
        edits: changeset.edits,
      }),
    });
    if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
    const result = await resp.json();
    setStatus(`Saved: ${result.rows_affected} rows, stages ${result.stages_run.join(',')}`);
    changeset = emptyChangeset();
    localStorage.removeItem(_LS_KEY);
    renderChangesetPanel(changeset);
    lg.editor.clearLayers();
    await refreshMap();
    await fetchHullsAndSlots();
  } catch (e) {
    setStatus('Save failed: ' + e.message);
    console.error('Save error:', e);
  } finally {
    spinner.style.display = 'none';
  }
}

// ── Status / error helpers ────────────────────────────────────────────────────
function setStatus(msg) { document.getElementById('status').textContent = msg; }
function showError(msg)  {
  const el = document.getElementById('error-banner');
  el.textContent = msg; el.style.display = 'block';
  setStatus('Error — see banner');
}
